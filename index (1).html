<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>80/90s Party · Los 50 de Pablo</title>
<meta property="og:title" content="80/90s Party · Los 50 de Pablo">
<meta property="og:description" content="Sábado 31 de octubre · 22:00 hs · Hills Aeroclub, Yerbabuena">
<meta property="og:image" content="invitacion.jpeg">
<style>
  :root{--bg:#000;--card:#0b0b12;--blue:#38b6ff;--pink:#ff2e93;--yellow:#ffd23f;--text:#fff}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at 50% 0,#1a0933 0,#000 60%) fixed;color:var(--text);font-family:system-ui,Arial,sans-serif;text-align:center;padding:16px;overflow-x:hidden}
  .wrap{max-width:480px;margin:0 auto;position:relative;z-index:2}
  .flyer{width:100%;border-radius:16px;animation:glow 3s ease-in-out infinite alternate}
  @keyframes glow{from{box-shadow:0 0 14px var(--pink)}to{box-shadow:0 0 34px var(--blue),0 0 60px var(--pink)}}
  h2{color:var(--yellow);margin:28px 0 10px;text-shadow:0 0 10px var(--yellow);animation:flicker 4s infinite}
  @keyframes flicker{0%,18%,22%,60%,64%,100%{opacity:1}20%,62%{opacity:.35}}
  #count{display:flex;gap:8px}
  .box{flex:1;border:2px solid var(--blue);border-radius:12px;padding:10px 4px;background:var(--card);box-shadow:0 0 12px var(--blue)}
  .box b{display:block;font-size:1.8rem;color:var(--yellow)}
  .box span{font-size:.75rem;color:var(--blue);text-transform:uppercase}
  form{display:grid;gap:10px;text-align:left}
  input,select,textarea{width:100%;padding:12px;border-radius:10px;border:2px solid var(--blue);background:var(--card);color:#fff;font-size:1rem;font-family:inherit}
  .btn{display:block;padding:14px;border:2px solid var(--pink);border-radius:12px;background:var(--card);color:#fff;font-size:1rem;font-weight:700;text-decoration:none;cursor:pointer;box-shadow:0 0 12px var(--pink);text-align:center}
  .btn:hover{background:var(--pink)}
  .main{border-color:var(--blue);box-shadow:0 0 14px var(--blue)}
  .main:hover{background:var(--blue)}
  .btns{display:grid;gap:12px;margin:20px 0}
  #ok{display:none;border:2px solid var(--yellow);border-radius:12px;padding:16px;color:var(--yellow);box-shadow:0 0 14px var(--yellow)}
  small{color:#999}
  #music{position:fixed;top:12px;right:12px;z-index:5;width:46px;height:46px;border-radius:50%;border:2px solid var(--blue);background:var(--card);color:#fff;font-size:1.2rem;cursor:pointer;box-shadow:0 0 12px var(--blue);display:none}
  .spark{position:fixed;z-index:1;pointer-events:none;color:var(--c);text-shadow:0 0 10px var(--c);animation:rise linear infinite;opacity:0}
  @keyframes rise{0%{transform:translateY(105vh) rotate(0);opacity:0}10%{opacity:.9}100%{transform:translateY(-10vh) rotate(360deg);opacity:0}}
  .confetti{position:fixed;top:-10px;z-index:9;width:8px;height:14px;animation:fall 2.5s linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
</style>
</head>
<body>
<button id="music" title="Música">🎵</button>
<audio id="audio" src="musica.mp3" loop preload="none"></audio>

<div class="wrap">
  <img class="flyer" src="invitacion.jpeg" alt="Invitación 80/90s Party">

  <h2>Faltan</h2>
  <div id="count">
    <div class="box"><b id="d">0</b><span>días</span></div>
    <div class="box"><b id="h">0</b><span>horas</span></div>
    <div class="box"><b id="m">0</b><span>min</span></div>
    <div class="box"><b id="s">0</b><span>seg</span></div>
  </div>

  <h2>¿Venís?</h2>
  <form id="f">
    <input id="nombre" required placeholder="Tu nombre y apellido">
    <select id="asiste">
      <option value="Sí">¡Sí, voy! 🎉</option>
      <option value="No">No puedo ir 😢</option>
    </select>
    <input id="cant" type="number" min="1" max="10" value="1" placeholder="Cantidad de personas">
    <textarea id="msg" rows="2" placeholder="Mensaje o saludo (opcional)"></textarea>
    <button class="btn main" type="submit">✅ Confirmar asistencia</button>
  </form>
  <div id="ok">¡Gracias! Tu respuesta quedó registrada. 🪩</div>

  <div class="btns">
    <a class="btn" id="wa" href="#" target="_blank" rel="noopener">💬 Avisar también por WhatsApp</a>
    <button class="btn" id="cal">📅 Agregar al calendario</button>
    <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=Hills+Aeroclub+Yerbabuena+Tucuman">📍 Cómo llegar</a>
  </div>
  <small>Sábado 31 de octubre · 22:00 hs · Hills Aeroclub, Yerbabuena</small>
</div>

<script>
  // ====== EDITÁ ESTO ======
  const WHATSAPP = "5493816610666";   // tu número con código de país, sin + ni espacios
  const SHEET_URL = "";                // URL de tu Apps Script (ver instrucciones); vacío = solo WhatsApp
  const FECHA = new Date("2026-10-31T22:00:00-03:00");
  // ========================
  const $ = id => document.getElementById(id);

  // Cuenta regresiva
  function tick(){
    const diff = Math.max(0, FECHA - new Date());
    $("d").textContent = Math.floor(diff/864e5);
    $("h").textContent = Math.floor(diff%864e5/36e5);
    $("m").textContent = Math.floor(diff%36e5/6e4);
    $("s").textContent = Math.floor(diff%6e4/1e3);
  }
  tick(); setInterval(tick,1000);

  // Estrellas flotantes
  const cols = ["#38b6ff","#ff2e93","#ffd23f","#7CFF6B"];
  for(let i=0;i<14;i++){
    const s = document.createElement("div");
    s.className = "spark"; s.textContent = i%2 ? "✦" : "★";
    s.style.cssText = `left:${Math.random()*100}vw;font-size:${12+Math.random()*18}px;--c:${cols[i%4]};animation-duration:${8+Math.random()*10}s;animation-delay:${Math.random()*8}s`;
    document.body.appendChild(s);
  }

  // Música (el botón aparece solo si existe musica.mp3)
  const audio = $("audio"), mbtn = $("music");
  fetch("musica.mp3",{method:"HEAD"}).then(r=>{ if(r.ok) mbtn.style.display="block"; }).catch(()=>{});
  mbtn.addEventListener("click",()=>{
    if(audio.paused){ audio.play(); mbtn.textContent="🔊"; } else { audio.pause(); mbtn.textContent="🎵"; }
  });

  // WhatsApp
  function mensaje(){
    const n = $("nombre").value.trim() || "un invitado";
    return $("asiste").value === "Sí"
      ? `¡Hola Pablo! Soy ${n}. Confirmo asistencia a tus 50 (${$("cant").value} persona/s) 🎉`
      : `¡Hola Pablo! Soy ${n}. Lamentablemente no puedo ir, ¡pero te mando un abrazo enorme! 🎂`;
  }
  function updateWA(){ $("wa").href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(mensaje())}`; }
  ["nombre","asiste","cant"].forEach(id=>$(id).addEventListener("input",updateWA));
  updateWA();

  // Confeti
  function confetti(){
    for(let i=0;i<60;i++){
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random()*100+"vw";
      c.style.background = cols[i%4];
      c.style.animationDelay = Math.random()*.8+"s";
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),4000);
    }
  }

  // Enviar a Google Sheets
  $("f").addEventListener("submit", async e=>{
    e.preventDefault();
    const data = new URLSearchParams({
      nombre:$("nombre").value, asiste:$("asiste").value,
      personas:$("cant").value, mensaje:$("msg").value
    });
    if(SHEET_URL){
      try{ await fetch(SHEET_URL,{method:"POST",mode:"no-cors",body:data}); }catch(_){}
    }
    $("f").style.display="none"; $("ok").style.display="block";
    if($("asiste").value==="Sí") confetti();
  });

  // Calendario
  $("cal").addEventListener("click",()=>{
    const ics = ["BEGIN:VCALENDAR","VERSION:2.0","BEGIN:VEVENT",
      "DTSTART:20261101T010000Z","DTEND:20261101T070000Z",
      "SUMMARY:80/90s Party - Los 50 de Pablo",
      "LOCATION:Hills Aeroclub, Yerbabuena","END:VEVENT","END:VCALENDAR"].join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
    a.download = "fiesta-pablo-50.ics"; a.click();
  });
</script>
</body>
</html>
